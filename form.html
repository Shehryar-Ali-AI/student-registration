<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="form.html">Register</a>
        <a href="thanks.html">Thank You</a>
    </nav>

    <header id="welcome">
        <h1>Student Registration Form</h1>
        <p>Please fill in your information below.</p>
    </header>

    <main class="container">
        <form action="thanks.html" method="get">

            <h2>Personal Information</h2>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname"
                   placeholder="Enter your full name" required>

            <label for="regno">Registration No:</label>
            <input type="text" id="regno" name="regno" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="03xxxxxxxxx">

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="16" max="40">

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">

            <label>Gender:</label>
            <div class="choice">
                <input type="radio" id="male" name="gender" value="Male">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="Female">
                <label for="female">Female</label>
            </div>

            <label for="department">Department:</label>
            <select id="department" name="department">
                <option value="AI">Artificial Intelligence</option>
                <option value="CS">Computer Science</option>
                <option value="SE">Software Engineering</option>
                <option value="EE">Electrical Engineering</option>
            </select>

            <label>Interests:</label>
            <div class="choice">
                <input type="checkbox" id="web" name="interest" value="Web">
                <label for="web">Web</label>

                <input type="checkbox" id="ai" name="interest" value="AI">
                <label for="ai">AI</label>

                <input type="checkbox" id="games" name="interest" value="Games">
                <label for="games">Games</label>
            </div>

            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="4"
                      placeholder="Enter your address"></textarea>

            <input type="submit" value="Register">
            <input type="reset" value="Clear">

        </form>
    </main>

    <footer>
        <p>&copy; 2026 NUTECH Student Registration</p>
    </footer>

</body>
</html>
